# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# History buffer size
set-option -g history-limit 100000

# Reload config file (change file location to your the tmux.conf you want to use)
bind 'r' source-file ~/.tmux.conf

# Status bar
set-option -g status-position top

set -g status-style "bg=#111827,fg=#e5e7eb"
set -g status-left "#[bg=#2563eb,fg=#ffffff,bold] #S #[bg=#111827,fg=#e5e7eb] "
set -g window-status-format "#[fg=#94a3b8] #I:#W "
set -g window-status-current-format "#[bg=#1d4ed8,fg=#ffffff,bold] #I:#W "
set -g status-right "#[bg=#22c55e,fg=#052e16,bold]"

# Changing layout
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Move windows
bind -n M-S-Right swap-window -d -t +1
bind -n M-S-Left swap-window -d -t -1

# Navigate windows
bind -n M-Left previous-window
bind -n M-Right next-window


# Enable mouse mode (tmux 2.1 and above)
set -g mouse on


# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1


# True Colors (24-bit)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"


# Select Layouts
bind -n M-V select-layout main-vertical
bind -n M-H select-layout main-horizontal
bind -n M-v select-layout even-vertical
bind -n M-h select-layout even-horizontal


# Split panes
bind '-' split-window -v
bind '_' split-window -fv
bind '\' split-window -h
bind '|' split-window -fh
unbind '"'
unbind '%'

# Windows
bind 'c' new-window

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
