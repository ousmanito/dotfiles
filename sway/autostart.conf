exec ~/.config/sway/scripts/start-session-services.sh
exec sh -c '~/.config/sway/scripts/start-waybar.sh'
exec mako
exec ~/.config/sway/scripts/wallpaper.sh
exec ~/.config/sway/scripts/start-pavucontrol.sh
exec /home/obathily/Applications/Obsidian-1.14.4_0e3d4798c8cf52122837e9ff46cdb479.AppImage --no-sandbox
exec /home/obathily/Applications/Todoist-linux-9.31.0-x86_64-latest.AppImage --no-sandbox
exec google-chrome-stable
assign [app_id="google-chrome"] $ws1
assign [app_id="terminal"] $ws2
assign [app_id="obsidian"] $ws3
assign [app_id="todoist"] $ws4
assign [instance="zoom"] $ws5
assign [app_id="org.gnome.Evolution"] $ws5
exec "alacritty --class terminal,terminal"

exec_always sh -c 'sleep 4; ~/.config/sway/scripts/layout-auto.sh'
