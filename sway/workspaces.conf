# Workspaces avec les touches physiques 1-4
bindcode $mod+10 workspace $ws1
bindcode $mod+11 workspace $ws2
bindcode $mod+12 workspace $ws3
bindcode $mod+13 workspace $ws4
bindcode $mod+14 workspace $ws5
bindcode $mod+15 workspace number 6
bindcode $mod+16 workspace number 7
bindcode $mod+17 workspace number 8
bindcode $mod+18 workspace number 9
bindcode $mod+19 workspace number 10

# Déplacer la fenêtre vers workspace
bindcode $mod+Shift+10 move container to workspace $ws1; workspace $ws1
bindcode $mod+Shift+11 move container to workspace $ws2; workspace $ws2
bindcode $mod+Shift+12 move container to workspace $ws3; workspace $ws3
bindcode $mod+Shift+13 move container to workspace $ws4; workspace $ws4
bindcode $mod+Shift+14 move container to workspace $ws5; workspace $ws5
bindcode $mod+Shift+15 move container to workspace number 6
bindcode $mod+Shift+16 move container to workspace number 7
bindcode $mod+Shift+17 move container to workspace number 8
bindcode $mod+Shift+18 move container to workspace number 9
bindcode $mod+Shift+19 move container to workspace number 10

# Workspaces
set $ws1 web
set $ws2 dev
set $ws3 notes
set $ws4 tasks
set $ws5 com

bindsym $mod+Tab workspace back_and_forth

bindsym $mod+Ctrl+h move workspace to output left
bindsym $mod+Ctrl+l move workspace to output right
bindsym $mod+Ctrl+k move workspace to output up
bindsym $mod+Ctrl+j move workspace to output down

for_window [app_id="org.pulseaudio.pavucontrol"] \
    floating enable, \
    resize set width 90 ppt height 90 ppt, \
    move position center, \
    move scratchpad

for_window [app_id="scratchpad-term"] \
    floating enable, \
    move scratchpad, \
    scratchpad show, \
    resize set width 90 ppt height 90 ppt, \
    move position center

for_window [app_id="nm-connection-editor"] \
    floating enable, \
    move scratchpad, \
    resize set width 90 ppt height 90 ppt, \
    move position center

for_window [app_id="blueman-manager"] \
    floating enable, \
    move scratchpad, \
    resize set width 90 ppt height 90 ppt, \
    move position center

for_window [app_id="google-chrome" title="^DevTools - "] \
    floating enable, \
    move scratchpad, \
    resize set width 90 ppt height 90 ppt, \
    move position center

for_window [app_id="org.keepassxc.KeePassXC"] \
    floating enable, \
    move scratchpad, \
    scratchpad show, \
    resize set width 90 ppt height 90 ppt, \
    move position center

for_window [app_id="org.gnome.Nautilus"] \
    floating enable, \
    move scratchpad, \
    scratchpad show, \
    resize set width 90 ppt height 90 ppt, \
    move position center
