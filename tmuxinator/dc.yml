name: desc
root: ~/dev/desc
tmux_options: -f ~/.tmux.conf
tmux_detached: false
on_project_first_start: docker compose up -d
on_project_exit: docker compose stop
startup_window: ide

windows:
  - ide:
      layout: main-vertical
      panes:
        - pane_with_multiples_commands:
            - cd django/
            - pv
            - cd ..
            - nv .
  - ai:
      layout: main-vertical
      panes:
        - codex resume
  - logs:
      layout: 240x27,0,0{120x27,0,0,2,119x27,121,0,13},240x28,0,28{120x28,0,28,7,119x28,121,28,12}
      panes:
        - dcu django
        - dcu celery
        - dcu nextjs
        - dcu provisionner
  - databases:
      layout: 239x26,0,0{119x26,0,0,5,119x26,120,0,12},239x27,0,27{119x27,0,27,13,119x27,120,27,24}
      panes:
        - dcu postgres
        - dcu eds-master-db
        - dcu metabase
        - dcu manifest-repository
  - git2:
      layout: even-horizontal
      panes:
        - gs
        - glo
  - git1:
      panes:
        - git diff
  - shell:
      panes:
        - ""

