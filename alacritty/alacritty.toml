[general]
import = ["/home/obathily/.config/alacritty/themes/night_owl.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 10

[font.bold]
family = "RobotoMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "RobotoMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "RobotoMono Nerd Font"
style = "Italic"

[font.normal]
family = "RobotoMono Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"

[window]
padding = { x = 0, y = 0 }
dynamic_padding = true
opacity = 0.77
startup_mode = "Fullscreen"
